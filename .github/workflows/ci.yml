name: CI

on:
  push: { branches: [main] }
  pull_request:

# Merge nur bei gruen. Ein roter Build auf einem System, das Kapital bewegt,
# ist kein Hinweis, sondern ein Stoppschild.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        # Enthaelt den No-Look-Ahead-Test gegen eine eingebettete Postgres-Instanz
        # (PGlite) — kein Docker-Dienst noetig.
        run: pnpm test

      - name: Web-Build
        run: pnpm --filter @sae/web build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
