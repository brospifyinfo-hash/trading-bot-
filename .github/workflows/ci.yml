name: CI

on:
  push: { branches: [main] }
  pull_request:

# Merge nur bei gruen. Ein roter Build auf einem System, das Kapital bewegt,
# ist kein Hinweis, sondern ein Stoppschild.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Ohne `version`: die Action liest `packageManager` aus der
      # package.json. Genau eine Quelle fuer die pnpm-Version — beide Angaben
      # gleichzeitig quittiert pnpm mit ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        # Enthaelt den No-Look-Ahead-Test gegen eine eingebettete Postgres-Instanz
        # (PGlite) — kein Docker-Dienst noetig.
        run: pnpm test

      - name: Web-Build
        run: pnpm --filter @sae/web build

  # Baut das Worker-Image wirklich. Ohne diesen Job faellt ein Fehler im
  # Dockerfile erst auf dem Worker-Host auf — also dort, wo die Rueckmeldung am
  # langsamsten und die Fehlersuche am unangenehmsten ist.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Worker-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: sae-worker:ci

      - name: Startet der Container und meldet er sich gesund?
        run: |
          # Ohne WORKER_ROLE muss der Container sichtbar scheitern — das ist die
          # Zusicherung, dass er nie stillschweigend eine falsche Rolle uebernimmt.
          if docker run --rm --env DATABASE_URL=postgres://x@127.0.0.1:1/x \
                        --env SOLANA_RPC_URL=https://example.invalid \
                        sae-worker:ci 2>/dev/null; then
            echo "FEHLER: Container startete ohne WORKER_ROLE"; exit 1
          fi
          echo "OK: ohne WORKER_ROLE kein Start."

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
