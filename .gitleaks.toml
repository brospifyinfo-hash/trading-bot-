title = "Solana Alpha Engine — Secret Scanning"

[extend]
useDefault = true

[[rules]]
id = "solana-keypair-byte-array"
description = "Solana Keypair als 64-Byte-Array (Standard-Export von solana-keygen)"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){40,}\d{1,3}\s*\]'''
tags = ["solana", "private-key"]

[[rules]]
id = "solana-base58-secret"
description = "Base58-kodierter 64-Byte-Secret-Key (Phantom-Export-Format)"
regex = '''(?i)(secret|private)[_-]?key["'\s:=]+[1-9A-HJ-NP-Za-km-z]{85,90}'''
tags = ["solana", "private-key"]

[[rules]]
id = "bip39-seed-phrase"
description = "Moegliche Seed Phrase (12 oder 24 Woerter hinter mnemonic/seed)"
regex = '''(?i)(mnemonic|seed[_-]?phrase)["'\s:=]+(?:[a-z]{3,8}\s+){11,23}[a-z]{3,8}'''
tags = ["seed"]

[allowlist]
paths = [
  '''pnpm-lock\.yaml''',
  '''\.gitleaks\.toml''',
]
